{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<a class="back-link" href="/login"><span aria-hidden="true">←</span> Back to sign in</a>
<div class="form-heading compact-heading"><p class="eyebrow form-eyebrow">ACCOUNT RECOVERY</p><h2>Choose a new password</h2><p class="form-intro">Make it at least 12 characters and different from your old one.</p></div>
{% if error %}<div class="notice notice-error" role="alert">{{ error }}</div>{% endif %}
<form class="auth-form" action="/reset-password" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="token" value="{{ token }}">
  <label class="field-label" for="password">New password</label>
  <div class="input-wrap"><span class="input-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><rect x="3" y="8.5" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M6 8.5V6a4 4 0 0 1 8 0v2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" placeholder="12 characters minimum" required><button class="password-toggle" type="button" data-toggle-password="password" aria-label="Show password" title="Show password"><svg viewBox="0 0 20 20" fill="none"><path d="M2 10s2.9-5 8-5 8 5 8 5-2.9 5-8 5-8-5-8-5Z" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.2" stroke="currentColor" stroke-width="1.5"/></svg></button></div>
  <label class="field-label second-label" for="confirm_password">Confirm new password</label>
  <div class="input-wrap"><span class="input-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><rect x="3" y="8.5" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M6 8.5V6a4 4 0 0 1 8 0v2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" placeholder="Re-enter your new password" required></div>
  <button class="primary-button" type="submit">Update password <span aria-hidden="true">→</span></button>
</form>
{% endblock %}
