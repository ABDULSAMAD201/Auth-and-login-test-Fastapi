{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<a class="back-link" href="/"><span aria-hidden="true">←</span> Back to account</a>
<div class="form-heading compact-heading"><p class="eyebrow form-eyebrow">ACCOUNT SECURITY</p><h2>Change your password</h2><p class="form-intro">Confirm your current password, then choose a new one.</p></div>
{% if error %}<div class="notice notice-error" role="alert">{{ error }}</div>{% endif %}
<form class="auth-form" action="/change-password" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label class="field-label" for="current_password">Current password</label>
  <div class="input-wrap"><span class="input-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><rect x="3" y="8.5" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M6 8.5V6a4 4 0 0 1 8 0v2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span><input id="current_password" name="current_password" type="password" autocomplete="current-password" required></div>
  <label class="field-label second-label" for="password">New password</label>
  <div class="input-wrap"><span class="input-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><rect x="3" y="8.5" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M6 8.5V6a4 4 0 0 1 8 0v2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" placeholder="12 characters minimum" required></div>
  <label class="field-label second-label" for="confirm_password">Confirm new password</label>
  <div class="input-wrap"><span class="input-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><rect x="3" y="8.5" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M6 8.5V6a4 4 0 0 1 8 0v2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required></div>
  <button class="primary-button" type="submit">Save new password <span aria-hidden="true">→</span></button>
</form>
{% endblock %}
